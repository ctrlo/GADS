name: 'GADS Tests'
on:
  push:
    branches:
      - master
      - dev
      - hotfix
    paths-ignore:
      - '*.md'
      - VERSION
  pull_request:
    branches:
      - master
      - dev
      - hotfix
    paths-ignore:
      - '*.md'
      - VERSION

jobs:
  unit_tests:
    name: 'Unit Tests'
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 30
    container: debian:trixie

    steps:
      - name: 'Check out the GADS repository'
        uses: 'actions/checkout@v4'
      - name: 'Install dependencies'
        run: |
          chmod +x ./.github/workflows/install.sh
          ./.github/workflows/install.sh
      - name: 'Run the unit tests'
        run: prove -lrs -j4 t

  webdriver_tests:
    name: 'Webdriver Tests for ${{ matrix.browser.name }}'
    runs-on: '${{ matrix.browser.os }}'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: 'Chromium'
            command: 'chromedriver --port=4444 &'
            os: 'ubuntu-22.04'
          - name: 'Firefox'
            command: 'MOZ_HEADLESS=1 geckodriver --log warn &'
            os: 'ubuntu-22.04'

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    env:
      GADS_USERNAME: 'test@example.com'
      GADS_PASSWORD: 'xyz123'

    steps:
      - name: 'Check out the GADS code'
        uses: 'actions/checkout@v4'
      - name: 'Install dependencies'
        run: |
          sudo apt-get install -y libapache2-mod-perl2 libauth-yubikey-webclient-perl libauthen-oath-perl \
                             libconfig-inifiles-perl libconvert-base32-perl libcpanel-json-xs-perl \
                             libcrypt-saltedhash-perl libcrypt-urandom-perl libdancer2-perl \
                             libdata-dump-streamer-perl libdata-visitor-perl libdatetime-format-mysql-perl \
                             libdbd-mysql-perl libdbix-class-helpers-perl libdbix-class-perl libfcgi-perl \
                             libfile-copy-recursive-perl libimager-qrcode-perl libimager-perl \
                             libio-all-perl liblog-report-lexicon-perl liblog-report-perl \
                             libmail-box-perl libmail-transport-perl \
                             libmath-random-isaac-xs-perl libmoox-singleton-perl libpod-parser-perl \
                             libregexp-common-perl libstring-camelcase-perl libtemplate-perl \
                             libtext-autoformat-perl libtext-csv-perl libyaml-libyaml-perl \
                             libtree-dagnode-perl libalgorithm-dependency-perl libdatetime-set-perl \
                             libdata-compare-perl libtext-csv-encoded-perl libhtml-fromtext-perl \
                             libhtml-scrubber-perl libdbd-pg-perl postgresql postgresql-contrib \
                             libdatetime-format-pg-perl libset-infinite-perl libtie-cache-perl \
                             libmath-round-perl liblua5.3-dev \
                             libfile-slurp-perl libfile-mimeinfo-perl liblist-compare-perl \
                             libnet-oauth2-authorizationserver-perl libfontconfig1 libpdf-builder-perl \
                             fonts-liberation libfile-bom-perl libdatetime-format-iso8601-perl \
                             liblog-log4perl-perl chromium-bsu libfile-libmagic-perl liburl-encode-perl \
                             libtext-markdown-perl libauth-yubikey-webclient-perl \
                             libauth-yubikey-webclient-perl libauthen-oath-perl libconvert-base32-perl \
                             libimager-qrcode-perl libimager-perl cpanminus libtest-mocktime-perl \
                             libtest-tempdir-tiny-perl libdbd-sqlite3-perl libdatetime-format-sqlite-perl \
                             libtest-compile-perl libsession-token-perl libcrypt-openssl-random-perl \
                             libssl-dev build-essential
      - name: 'Install CPAN dependencies'
        run: |
          perl ./bin/output_cpanfile > ./cpanfile
          cpanm --installdeps . --cpanfile ./cpanfile --notest
      - name: 'Set up credentials for psql'
        # See https://wiki.postgresql.org/wiki/Pgpass
        run: |
          echo '*:*:*:postgres:postgrespassword' > ~/.pgpass
          chmod 600 ~/.pgpass
      - name: 'create uploads directory'
        run: |
          mkdir -p /tmp/uploads
          chmod 777 /tmp/uploads
      - name: 'Start the application'
        env:
          DANCER_CONFDIR: 'webdriver'
          PGDATABASE: 'postgres'
          PGHOST: 'localhost'
          PGUSER: 'postgres'
        run: |
          ./bin/setup_database
          perl bin/app.pl &
      - name: 'Run the Webdriver implementation'
        run: '${{ matrix.browser.command }}'
      - name: 'Run the Webdriver tests'
        run: prove -lmrsv webdriver/t

  cypress_tests:
    name: 'Cypress Tests for ${{ matrix.browser.name }}'
    runs-on: '${{ matrix.browser.os }}'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: 'chrome'
            os: 'ubuntu-22.04'
            node_version: 24.x

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    env:
      GADS_USERNAME: 'test@example.com'
      GADS_PASSWORD: 'xyz123'

    steps:
      - name: 'Check out the GADS code'
        uses: 'actions/checkout@v4'
      - name: 'Install dependencies'
        run: |
          sudo apt-get install -y libapache2-mod-perl2 libauth-yubikey-webclient-perl libauthen-oath-perl \
                             libconfig-inifiles-perl libconvert-base32-perl libcpanel-json-xs-perl \
                             libcrypt-saltedhash-perl libcrypt-urandom-perl libdancer2-perl \
                             libdata-dump-streamer-perl libdata-visitor-perl libdatetime-format-mysql-perl \
                             libdbd-mysql-perl libdbix-class-helpers-perl libdbix-class-perl libfcgi-perl \
                             libfile-copy-recursive-perl libimager-qrcode-perl libimager-perl \
                             libio-all-perl liblog-report-lexicon-perl liblog-report-perl \
                             libmail-box-perl libmail-transport-perl \
                             libmath-random-isaac-xs-perl libmoox-singleton-perl libpod-parser-perl \
                             libregexp-common-perl libstring-camelcase-perl libtemplate-perl \
                             libtext-autoformat-perl libtext-csv-perl libyaml-libyaml-perl \
                             libtree-dagnode-perl libalgorithm-dependency-perl libdatetime-set-perl \
                             libdata-compare-perl libtext-csv-encoded-perl libhtml-fromtext-perl \
                             libhtml-scrubber-perl libdbd-pg-perl postgresql postgresql-contrib \
                             libdatetime-format-pg-perl libset-infinite-perl libtie-cache-perl \
                             libmath-round-perl liblua5.3-dev \
                             libfile-slurp-perl libfile-mimeinfo-perl liblist-compare-perl \
                             libnet-oauth2-authorizationserver-perl libfontconfig1 libpdf-builder-perl \
                             fonts-liberation libfile-bom-perl libdatetime-format-iso8601-perl \
                             liblog-log4perl-perl chromium-bsu libfile-libmagic-perl liburl-encode-perl \
                             libtext-markdown-perl libauth-yubikey-webclient-perl \
                             libauth-yubikey-webclient-perl libauthen-oath-perl libconvert-base32-perl \
                             libimager-qrcode-perl libimager-perl cpanminus libtest-mocktime-perl \
                             libtest-tempdir-tiny-perl libdbd-sqlite3-perl libdatetime-format-sqlite-perl \
                             libtest-compile-perl libsession-token-perl libcrypt-openssl-random-perl \
                             libssl-dev build-essential
      - name: 'Install CPAN dependencies'
        run: |
          perl ./bin/output_cpanfile > ./cpanfile
          cpanm --installdeps . --cpanfile ./cpanfile --notest
      - name: 'check Dancer2 plugin'
        run: perl -e "print join(', ', @INC);"
      - name: 'Set up credentials for psql'
        # See https://wiki.postgresql.org/wiki/Pgpass
        run: |
          echo '*:*:*:postgres:postgrespassword' > ~/.pgpass
          chmod 600 ~/.pgpass
      - name: 'Install YARN dependencies'
        run: |
          sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb
          yarn
          yarn build --no-watch
      - name: 'create uploads directory'
        run: |
          mkdir -p /tmp/uploads
          chmod 777 /tmp/uploads
      - name: 'Start the application'
        env:
          DANCER_CONFDIR: 'webdriver'
          PGDATABASE: 'postgres'
          PGHOST: 'localhost'
          PGUSER: 'postgres'
          TEST: '1'
        run: |
          ./bin/setup_database
          perl bin/app.pl &
      - name: 'Run the Cypress tests'
        run: yarn cypress run --browser ${{ matrix.browser.name }}

  js_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Jest doesn't allow running on Node 22 - _very_ buggy
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn
      - run: yarn jest --passWithNoTests
